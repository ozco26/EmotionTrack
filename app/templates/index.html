<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>EmotionTrack - Audio Bot</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">EmotionTrack - Audio Bot</span>
    </div>
</nav>

<div class="container mt-4">
    <div class="card shadow">
        <div class="card-body">

            <div id="chat-box" class="mb-3" style="height:600px; overflow-y:auto;">
            </div>

            <div class="input-group">
                <input type="textarea" id="question" class="form-control"
                       placeholder="Pregunta sobre la llamada...">
                <button class="btn btn-primary" onclick="sendQuestion()">
                    Enviar
                </button>
            </div>

        </div>
    </div>
</div>

<script>

const questionInput = document.getElementById("question");

function sendQuestion() {
    const question = questionInput.value;

    if (!question.trim()) return;

    fetch(`/ask?q=${encodeURIComponent(question)}`)
        .then(response => response.json())
        .then(data => {
            const chatBox = document.getElementById("chat-box");

            chatBox.innerHTML += `
                <div class="text-end mb-2">
                    <span class="badge bg-primary p-2">${data.question}</span>
                </div>
                <div class="text-start mb-2">
                    <span class="badge bg-secondary p-2">${data.answer}</span>
                </div>
            `;

            chatBox.scrollTop = chatBox.scrollHeight;
            questionInput.value = "";
            questionInput.focus()
        });
}

questionInput.addEventListener("keydown", function(event){
    if(event.key==="Enter"){
        event.preventDefault();
        sendQuestion();
    }
}) 

</script>

</body>
</html>
